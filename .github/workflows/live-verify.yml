name: Live Hugging Face verification

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify model IDs, parameter counts, and license metadata
        run: make verify-live
